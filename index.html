<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT Booking System | Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; }
        .purple-gradient { background: linear-gradient(135deg, #6200ee 0%, #9c27b0 100%); }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .slot-btn { transition: all 0.2s ease; }
        .slot-btn:not(.disabled):hover { background: #6200ee; transform: translateY(-2px); }
        .disabled { opacity: 0.3; cursor: not-allowed; border-color: gray; color: gray; }
    </style>
</head>
<body class="p-5">

    <div class="max-w-md mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">
                FitHub Booking
            </h1>
            <p class="text-gray-400">Pilih Personal Trainer & Atur Jadwalmu</p>
        </header>

        <section id="step1">
            <h2 class="text-xl font-semibold mb-4">Pilih Coach:</h2>
            <div class="space-y-4" id="ptList">
                </div>
        </section>

        <section id="step2" class="hidden">
            <button onclick="backToPT()" class="mb-4 text-purple-400 text-sm flex items-center">
                ← Kembali pilih Coach
            </button>
            <div class="glass p-5 rounded-2xl mb-6">
                <div class="flex items-center gap-4 mb-4">
                    <img id="displayFoto" src="" class="w-16 h-16 rounded-full object-cover border-2 border-purple-500">
                    <div>
                        <h3 id="displayNama" class="text-xl font-bold text-white"></h3>
                        <p id="displaySpesialis" class="text-xs text-purple-300 uppercase tracking-widest"></p>
                    </div>
                </div>
                <p class="text-sm text-gray-400">Pilih jam latihan yang tersedia:</p>
            </div>

            <div class="grid grid-cols-2 gap-3" id="scheduleGrid">
                </div>
        </section>

        <div id="modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-6 z-50">
            <div class="glass p-6 rounded-2xl w-full max-w-sm">
                <h3 class="text-xl font-bold mb-4 text-purple-400">Lengkapi Data</h3>
                <p class="text-sm mb-4 text-gray-300">Sesi kamu dengan <span id="confirmPT" class="font-bold"></span> pada jam <span id="confirmJam" class="font-bold"></span>.</p>
                <input type="text" id="clientName" placeholder="Masukkan Nama Kamu" class="w-full bg-white/10 border border-white/20 p-3 rounded-lg mb-4 outline-none focus:border-purple-500">
                <div class="flex gap-2">
                    <button onclick="closeModal()" class="flex-1 p-3 bg-gray-700 rounded-lg">Batal</button>
                    <button onclick="checkout()" class="flex-1 p-3 purple-gradient rounded-lg font-bold text-white">Booking!</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data Dummy untuk Demo
        const ptData = [
            { id: 1, nama: "Ikhsan", spesialis: "Weight Loss", foto: "https://i.pravatar.cc/150?u=ikhsan", wa: "628123456789", 
              slots: [ {t: "06:00", b: false}, {t: "08:00", b: true}, {t: "10:00", b: false}, {t: "19:00", b: false} ] },
            { id: 2, nama: "Coach Budi", spesialis: "Bulking / Muscle", foto: "https://i.pravatar.cc/150?u=budi", wa: "628987654321", 
              slots: [ {t: "09:00", b: false}, {t: "11:00", b: false}, {t: "16:00", b: true}, {t: "20:00", b: false} ] },
            { id: 3, nama: "Siska Fit", spesialis: "Yoga & Cardio", foto: "https://i.pravatar.cc/150?u=siska", wa: "628112233445", 
              slots: [ {t: "07:00", b: false}, {t: "08:00", b: false}, {t: "17:00", b: false}, {t: "18:00", b: true} ] }
        ];

        let selectedPT = null;
        let selectedJam = "";

        // Render Daftar PT
        function renderPT() {
            const list = document.getElementById('ptList');
            ptData.forEach(pt => {
                list.innerHTML += `
                    <div onclick="selectPT(${pt.id})" class="glass p-4 rounded-2xl flex items-center justify-between cursor-pointer hover:bg-white/10 transition">
                        <div class="flex items-center gap-4">
                            <img src="${pt.foto}" class="w-12 h-12 rounded-full border border-purple-500">
                            <div>
                                <h4 class="font-bold">${pt.nama}</h4>
                                <p class="text-xs text-gray-400">${pt.spesialis}</p>
                            </div>
                        </div>
                        <span class="text-purple-400">→</span>
                    </div>
                `;
            });
        }

        function selectPT(id) {
            selectedPT = ptData.find(p => p.id === id);
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            
            document.getElementById('displayNama').innerText = selectedPT.nama;
            document.getElementById('displaySpesialis').innerText = selectedPT.spesialis;
            document.getElementById('displayFoto').src = selectedPT.foto;

            const grid = document.getElementById('scheduleGrid');
            grid.innerHTML = "";
            selectedPT.slots.forEach(s => {
                grid.innerHTML += `
                    <button onclick="openModal('${s.t}')" class="slot-btn border border-purple-500 p-4 rounded-xl font-bold ${s.b ? 'disabled' : ''}" ${s.b ? 'disabled' : ''}>
                        ${s.t} ${s.b ? '(Full)' : ''}
                    </button>
                `;
            });
        }

        function backToPT() {
            document.getElementById('step1').classList.remove('hidden');
            document.getElementById('step2').classList.add('hidden');
        }

        function openModal(jam) {
            selectedJam = jam;
            document.getElementById('confirmPT').innerText = selectedPT.nama;
            document.getElementById('confirmJam').innerText = jam;
            document.getElementById('modal').classList.replace('hidden', 'flex');
        }

        function closeModal() {
            document.getElementById('modal').classList.replace('flex', 'hidden');
        }

        function checkout() {
            const clientName = document.getElementById('clientName').value;
            if(!clientName) return alert("Masukkan namamu!");
            
            const msg = `Halo ${selectedPT.nama}, saya ${clientName}. Saya mau booking sesi latihan jam ${selectedJam}. Apakah Coach tersedia?`;
            const waUrl = `https://api.whatsapp.com/send?phone=${selectedPT.wa}&text=${encodeURIComponent(msg)}`;
            
            window.open(waUrl, '_blank');
            closeModal();
        }

        renderPT();
    </script>
</body>
</html>
