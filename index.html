<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Jadwal PT Ikhsan</title>
    <style>
        /* Gaya Visual (Warna Ungu sesuai seleramu) */
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #6200ee; text-align: center; }
        .pt-info { text-align: center; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        /* State Tombol */
        .slot { 
            padding: 15px; border: 1px solid #6200ee; border-radius: 8px; 
            text-align: center; cursor: pointer; font-weight: bold; color: #6200ee;
            transition: 0.3s;
        }
        .slot:hover { background: #6200ee; color: white; }
        .booked { background: #e0e0e0; border-color: #bdbdbd; color: #757575; cursor: not-allowed; }
        
        /* Modal Form */
        #bookingForm { display: none; margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;}
        button { width: 100%; padding: 12px; background: #6200ee; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;}
    </style>
</head>
<body>

<div class="card">
    <div class="pt-info">
        <h2>Jadwal PT Ikhsan</h2>
        <p>Sustain with 1 Coach</p>
    </div>

    <div id="slotGrid" class="grid">
        </div>

    <div id="bookingForm">
        <h3>Konfirmasi Booking</h3>
        <p id="selectedTimeText"></p>
        <input type="text" id="clientName" placeholder="Nama Lengkap" required>
        <button onclick="sendToWA()">Konfirmasi via WhatsApp</button>
    </div>
</div>

<script>
    // Data "Bagian Dalam" (Bisa diganti API nantinya)
    const availableSlots = [
        { jam: "06:00", booked: false },
        { jam: "08:00", booked: true },
        { jam: "10:00", booked: false },
        { jam: "16:00", booked: false },
        { jam: "19:00", booked: false },
        { jam: "21:00", booked: true }
    ];

    let selectedTime = "";

    // Fungsi nampilin slot
    function renderSlots() {
        const grid = document.getElementById('slotGrid');
        grid.innerHTML = "";
        availableSlots.forEach(slot => {
            const div = document.createElement('div');
            div.className = `slot ${slot.booked ? 'booked' : ''}`;
            div.innerText = slot.jam;
            if (!slot.booked) {
                div.onclick = () => selectSlot(slot.jam);
            } else {
                div.innerText += " (Full)";
            }
            grid.appendChild(div);
        });
    }

    function selectSlot(jam) {
        selectedTime = jam;
        document.getElementById('selectedTimeText').innerText = "Jam Pilihan: " + jam;
        document.getElementById('bookingForm').style.display = 'block';
        window.scrollTo(0, document.body.scrollHeight);
    }

    function sendToWA() {
        const name = document.getElementById('clientName').value;
        if (!name) return alert("Isi nama dulu!");
        
        const phone = "628123456789"; // Ganti No WA Ikhsan di sini
        const text = `Halo Coach Ikhsan, saya ${name}. Saya mau konfirmasi booking jadwal latihan untuk jam ${selectedTime}. Apakah tersedia?`;
        
        const waLink = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(text)}`;
        window.open(waLink, '_blank');
    }

    renderSlots();
</script>

</body>
</html>
