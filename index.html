<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sawah Indo Script | Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #4ade80, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-2xl w-full glass rounded-3xl p-8 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold gradient-text mb-2 tracking-tight">SAWAH INDO</h1>
            <p class="text-slate-400">Script Roblox Otomatis & Anti-Ribet</p>
        </div>

        <div class="relative group">
            <div class="absolute -inset-1 bg-gradient-to-r from-green-400 to-blue-500 rounded-xl blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
            <div class="relative bg-slate-900 rounded-xl p-5 border border-slate-700">
                <pre id="scriptCode" class="text-sm text-green-400 overflow-x-auto">loadstring(game:HttpGet("https://pastebin.com/raw/1GJ9A4Yd"))()</pre>
            </div>
        </div>

        <button onclick="copyToClipboard()" id="copyBtn" class="w-full mt-6 bg-white text-slate-900 font-bold py-4 rounded-xl hover:bg-slate-200 transition duration-300 flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
            </svg>
            COPY SCRIPT
        </button>

        <div class="mt-8 flex justify-between items-center text-xs text-slate-500 border-t border-slate-800 pt-6">
            <span>Versi: 1.0.2 (Stable)</span>
            <span class="flex items-center gap-1 italic">Dibuat dengan 🔥 oleh Kamu</span>
        </div>
    </div>

    <script>
        function copyToClipboard() {
            const code = document.getElementById('scriptCode').innerText;
            const btn = document.getElementById('copyBtn');
            
            navigator.clipboard.writeText(code).then(() => {
                // Animasi Berhasil
                btn.innerHTML = 'COPIED! ✅';
                btn.classList.replace('bg-white', 'bg-green-500');
                btn.classList.add('text-white');
                
                setTimeout(() => {
                    btn.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                        </svg>
                        COPY SCRIPT`;
                    btn.classList.replace('bg-green-500', 'bg-white');
                    btn.classList.remove('text-white');
                    btn.classList.add('text-slate-900');
                }, 2000);
            });
        }
    </script>
</body>
</html>
