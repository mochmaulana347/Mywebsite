<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Hub | Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>
    <div id="app" class="p-6 max-w-4xl mx-auto">
        
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-2xl font-bold text-green-400">SCRIPT HUB HUB</h1>
            <button @click="view = (view === 'user' ? 'login' : 'user')" class="text-xs text-slate-500 hover:text-white">
                {{ view === 'user' ? 'Admin Login' : 'Back to Home' }}
            </button>
        </div>

        <div v-if="view === 'user'" class="grid gap-6">
            <div v-for="(s, index) in scripts" :key="index" class="glass p-6 rounded-2xl relative">
                <h3 class="text-xl font-bold mb-3">{{ s.title }}</h3>
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 mb-4 overflow-x-auto">
                    <code class="text-green-400 text-sm">{{ s.code }}</code>
                </div>
                <button @click="copyScript(s.code, index)" :id="'btn-'+index" class="bg-white text-slate-900 px-4 py-2 rounded-lg font-bold w-full transition">
                    COPY SCRIPT
                </button>
            </div>
            <p v-if="scripts.length === 0" class="text-center text-slate-500">Belum ada script...</p>
        </div>

        <div v-if="view === 'login'" class="max-w-sm mx-auto glass p-8 rounded-3xl mt-20">
            <h2 class="text-xl font-bold mb-4 text-center">ADMIN ACCESS</h2>
            <input v-model="passInput" type="password" placeholder="Password" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 mb-4 outline-none">
            <button @click="checkPass" class="w-full bg-blue-600 py-3 rounded-lg font-bold">LOGIN</button>
        </div>

        <div v-if="view === 'admin'" class="glass p-8 rounded-3xl">
            <h2 class="text-2xl font-bold mb-6">ADD NEW SCRIPT</h2>
            <div class="grid gap-4">
                <input v-model="newTitle" type="text" placeholder="Judul Script (Contoh: Sawah Indo V2)" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 outline-none">
                <textarea v-model="newCode" rows="4" placeholder="Masukan Loadstring / Script Code" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 outline-none"></textarea>
                <button @click="addScript" class="bg-green-500 py-3 rounded-lg font-bold text-slate-900">PUBLISH SCRIPT</button>
            </div>

            <div class="mt-10 border-t border-slate-800 pt-6">
                <h3 class="mb-4 font-bold">MANAGE SCRIPTS</h3>
                <div v-for="(s, i) in scripts" class="flex justify-between items-center bg-slate-800 p-3 rounded-lg mb-2">
                    <span>{{ s.title }}</span>
                    <button @click="deleteScript(i)" class="text-red-500 text-sm">Delete</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { createApp } = Vue
        createApp({
            data() {
                return {
                    view: 'user',
                    passInput: '',
                    adminPass: 'sawah123', // <--- GANTI PASSWORD ADMIN KAMU DISINI
                    newTitle: '',
                    newCode: '',
                    scripts: JSON.parse(localStorage.getItem('myScripts') || '[]')
                }
            },
            methods: {
                checkPass() {
                    if(this.passInput === this.adminPass) {
                        this.view = 'admin';
                    } else {
                        alert('Password Salah!');
                    }
                },
                addScript() {
                    if(!this.newTitle || !this.newCode) return;
                    this.scripts.push({ title: this.newTitle, code: this.newCode });
                    this.saveData();
                    this.newTitle = ''; this.newCode = '';
                    alert('Script Berhasil Ditambah!');
                },
                deleteScript(index) {
                    if(confirm('Hapus script ini?')) {
                        this.scripts.splice(index, 1);
                        this.saveData();
                    }
                },
                saveData() {
                    localStorage.setItem('myScripts', JSON.stringify(this.scripts));
                },
                copyScript(code, id) {
                    navigator.clipboard.writeText(code);
                    const btn = document.getElementById('btn-'+id);
                    btn.innerText = 'COPIED! ✅';
                    setTimeout(() => btn.innerText = 'COPY SCRIPT', 2000);
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
