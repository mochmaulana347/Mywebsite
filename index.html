<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIRTUE HUB | SCRIPT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { background: #020617; color: #f8fafc; font-family: 'Space Grotesk', sans-serif; }
        .pro-glass { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .neon-text { text-shadow: 0 0 15px rgba(74, 222, 128, 0.4); }
        .code-box { background: #010409; border: 1px solid #1e293b; }
        .copy-btn {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .copy-btn:active { scale: 0.95; }
    </style>
</head>
<body class="p-6 md:p-12 min-h-screen">

    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-16">
            <h1 class="text-5xl font-extrabold tracking-tighter neon-text text-green-400 mb-2">VIRTUE<span class="text-white">HUB</span></h1>
            <p class="text-slate-500 uppercase tracking-[0.3em] text-xs">Official Cloud Script Database</p>
        </header>

        <div id="scriptContainer" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <p class="col-span-full text-center text-slate-600 animate-pulse">Syncing with GitHub Database...</p>
        </div>
    </div>

    <script>
        // --- KONFIGURASI ---
        // Ganti 'username' dan 'repo' sesuai nama GitHub kamu!
        const GITHUB_URL = "scripts.json"; 

        async function loadScripts() {
            const container = document.getElementById('scriptContainer');
            try {
                const response = await fetch(GITHUB_URL);
                const scripts = await response.json();
                
                container.innerHTML = ''; // Hapus loading

                scripts.forEach((s, i) => {
                    const card = `
                        <div class="pro-glass rounded-[2rem] p-8 hover:border-green-500/30 transition duration-500 group">
                            <div class="flex justify-between items-start mb-4">
                                <h3 class="text-2xl font-bold tracking-tight">${s.title}</h3>
                                <div class="h-2 w-2 bg-green-500 rounded-full shadow-[0_0_10px_#4ade80]"></div>
                            </div>
                            <p class="text-slate-400 text-sm mb-6 h-10 overflow-hidden">${s.desc || ''}</p>
                            
                            <div class="code-box rounded-xl p-4 mb-6 relative">
                                <code class="text-xs text-blue-400 block overflow-x-auto whitespace-nowrap scrollbar-hide">${s.code}</code>
                            </div>

                            <button onclick="copyScript('${s.code}', ${i})" id="btn-${i}" class="copy-btn w-full py-4 rounded-xl text-slate-900 font-black text-sm uppercase tracking-widest hover:brightness-110 shadow-lg shadow-green-500/10">
                                COPY TO CLIPBOARD
                            </button>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (err) {
                container.innerHTML = `<p class="text-red-400 text-center col-span-full">Failed to load scripts. Make sure scripts.json exists!</p>`;
            }
        }

        function copyScript(text, id) {
            navigator.clipboard.writeText(text);
            const btn = document.getElementById(`btn-${id}`);
            const original = btn.innerText;
            
            btn.innerText = "COPIED! ✅";
            btn.style.background = "#3b82f6"; // Blue when copied
            
            setTimeout(() => {
                btn.innerText = original;
                btn.style.background = ""; // Back to gradient
            }, 2000);
        }

        // Jalankan fungsi
        loadScripts();
    </script>
</body>
</html>
