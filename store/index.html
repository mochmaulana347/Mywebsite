<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store | Virtue ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#020617] text-white font-sans antialiased">

    <nav class="p-5 border-b border-slate-800 flex justify-between items-center max-w-6xl mx-auto">
        <a href="/" class="text-xl font-black text-blue-500 italic">VIRTUE ID</a>
        <a href="/" class="text-sm text-slate-400 hover:text-white transition">← Kembali</a>
    </nav>

    <section class="max-w-6xl mx-auto px-6 py-12">
        <div class="mb-10 text-center md:text-left">
            <h1 class="text-4xl font-black tracking-tight uppercase italic">Dashboard <span class="text-blue-500">Store</span></h1>
            <p class="text-slate-400">Data terupdate otomatis dari sistem pusat.</p>
        </div>

        <div id="product-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 text-center italic">
            <p class="col-span-full text-slate-500 animate-pulse">Sedang mengambil data produk...</p>
        </div>
    </section>

    <script>
        // MASUKKAN LINK PUBLISH TO WEB (.CSV) KAMU DI SINI
        const csvUrl = 'GANTI_DENGAN_LINK_CSV_GOOGLE_SHEETS_KAMU';

        async function loadProducts() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                const rows = data.split('\n').slice(1); // Lewati baris judul
                const container = document.getElementById('product-container');
                container.innerHTML = ''; // Hapus pesan loading

                rows.forEach(row => {
                    const columns = row.split(',');
                    if (columns.length >= 6) {
                        const [nama, desc, coret, asli, ikon, link] = columns;
                        container.innerHTML += `
                        <div class="bg-slate-900/50 border border-slate-800 p-6 rounded-3xl hover:border-blue-500 transition group">
                            <i class="fa-brands ${ikon} text-5xl mb-4 text-blue-400 group-hover:scale-110 transition-transform"></i>
                            <h3 class="text-xl font-bold mb-1 uppercase">${nama}</h3>
                            <p class="text-slate-400 text-xs mb-4 not-italic">${desc}</p>
                            <div class="mb-5">
                                <span class="text-[10px] text-slate-500 line-through block italic">Rp ${coret}</span>
                                <span class="text-2xl font-black text-white">Rp ${asli}</span>
                            </div>
                            <a href="${link}" class="block bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-black text-sm transition uppercase">
                                Beli Sekarang
                            </a>
                        </div>`;
                    }
                });
            } catch (error) {
                document.getElementById('product-container').innerHTML = '<p class="text-red-500">Gagal memuat data. Pastikan link CSV benar.</p>';
            }
        }

        loadProducts();
    </script>
</body>
</html>
